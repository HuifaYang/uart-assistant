[package]
name = "uart-assistant"
version = "0.2.0"
edition = "2021"
description = "Lightweight UART debug assistant with a WebView2 UI"
license = "MIT"

[dependencies]
chrono = "0.4"
dirs = "7"
encoding_rs = "0.8"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tao = "0.37"
wry = "0.57"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
